[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    bd: requiere conexion a MySQL
    api: requiere GEMINI_MODE=real y consume cuota de API
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
