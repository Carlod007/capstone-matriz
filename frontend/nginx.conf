# Servidor de los archivos ya compilados.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las direcciones del frontend —/proyectos/<id>/brechas y demas— no
    # corresponden a ningun archivo del disco: las resuelve el router dentro
    # del navegador. Sin esta linea, recargar una de ellas devuelve 404,
    # porque nginx busca un fichero con ese nombre y no lo encuentra.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con huella en el nombre (index-a1b2c3.js) cambian de nombre
    # cada vez que cambia su contenido, asi que se pueden guardar para
    # siempre. index.html no lleva huella y no debe guardarse: es quien dice
    # cuales son los archivos actuales, y servirlo desde la cache dejaria al
    # navegador pidiendo una version que ya no existe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
