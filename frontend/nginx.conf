# Servidor de los archivos ya compilados.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los PDF de un artículo pasan de un mega con facilidad, y el límite por
    # defecto de nginx es exactamente uno: sin esta línea, subir un artículo
    # devuelve 413 y el mensaje no menciona el tamaño.
    client_max_body_size 64m;

    # La API se sirve por el mismo origen, en /api.
    #
    # Antes el navegador llamaba directamente al backend en el puerto 8000, lo
    # que obligaba a abrir ese puerto al exterior y a mantener una lista de
    # orígenes de CORS. Con el proxy delante, la aplicación y su API comparten
    # origen: no hay CORS que configurar, el backend no está expuesto y el día
    # que haya certificado lo cubre a los dos.
    location /api/ {
        # La barra final del destino es la que quita el prefijo: /api/proyectos
        # llega al backend como /proyectos. Sin ella, llegaría /api/proyectos y
        # no existiría ninguna ruta con ese nombre.
        proxy_pass http://backend:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generar el estado del arte puede tardar más de los 60 segundos que
        # nginx espera por defecto.
        proxy_read_timeout 300s;
    }

    # Las direcciones del frontend —/proyectos/<id>/brechas y demas— no
    # corresponden a ningun archivo del disco: las resuelve el router dentro
    # del navegador. Sin esta linea, recargar una de ellas devuelve 404,
    # porque nginx busca un fichero con ese nombre y no lo encuentra.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con huella en el nombre (index-a1b2c3.js) cambian de nombre
    # cada vez que cambia su contenido, asi que se pueden guardar para
    # siempre. index.html no lleva huella y no debe guardarse: es quien dice
    # cuales son los archivos actuales, y servirlo desde la cache dejaria al
    # navegador pidiendo una version que ya no existe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
