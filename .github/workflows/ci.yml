# Integración continua
#
# Comprueba lo mismo que se comprueba a mano antes de un commit, pero sin
# depender de que alguien se acuerde: que el esquema se crea desde cero con
# Alembic, que la suite entera pasa contra una base real, y que el frontend
# compila sin errores de lint y conserva los recorridos principales del
# navegador.
#
# Aquí no va el número de pruebas a propósito: es un dato que cambia con cada
# commit y que nadie se acuerda de actualizar, así que a los pocos días miente.
# El número vive en el README y en docs/CONTEXTO.md, que es donde alguien lo
# busca; ahí sí hay que mantenerlo al día.
#
# La base de datos no se "prepara": se levanta vacía y se construye con
# `alembic upgrade head`. Si una migración está mal escrita, aquí se rompe;
# es justo lo que se quiere saber.

name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Un push nuevo sobre la misma rama cancela el anterior: no tiene sentido
# esperar el resultado de un commit que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pruebas y migraciones)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: capstone
        ports:
          - 3306:3306
        # Sin esta comprobación, los pasos empiezan antes de que MySQL
        # acepte conexiones y el primer comando falla por carrera.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # 127.0.0.1 y no localhost: con "localhost", PyMySQL intenta el socket
      # de Unix del runner, donde no hay ningún MySQL escuchando.
      MYSQL_URI: mysql+pymysql://root:ci@127.0.0.1:3306/capstone
      # Sin llamadas a la API: las pruebas no deben gastar cuota ni depender
      # de la red para dar un resultado.
      GEMINI_MODE: mock
      STORAGE_DIR: storage/pdfs
      # Aqui no hay .env y la aplicacion se niega a arrancar sin secreto, que
      # es justo lo que se quiere. Este valor es de usar y tirar: vive lo que
      # dura el trabajo y no firma nada fuera de el.
      JWT_SECRETO: secreto-de-integracion-continua-sin-ningun-valor-real

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Validar scripts operativos
        working-directory: .
        run: bash -n respaldar.sh restaurar_respaldo.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Crear el esquema desde cero
        run: alembic upgrade head

      - name: Comprobar que no quedan migraciones por escribir
        run: alembic check

      - name: Pruebas
        run: python -m pytest -v

  frontend:
    name: Frontend (lint y compilación)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci y no npm install: instala exactamente lo que fija el
      # package-lock, de modo que la compilación de aquí es la de cualquiera
      # que clone el repositorio.
      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas de componentes
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Instalar navegador para las pruebas
        run: npx playwright install --with-deps chromium

      - name: Recorridos críticos en navegador
        run: npm run test:e2e
